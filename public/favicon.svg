<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GT monogram">
  <!--
    Bookplate monogram. A solid field with the initials reversed out of it,
    because at 16px in a browser tab a hairline-ruled version disappears
    entirely and only mass reads. The on-page mark in the nav is the ruled
    variant of the same idea, set in Newsreader.

    Ink rather than the accent colour: the accent is reserved for live state
    and single important numbers, and a permanent tab icon is neither.
  -->
  <rect width="64" height="64" fill="#141414" />
  <text
    x="32"
    y="44"
    text-anchor="middle"
    font-family="Newsreader, Georgia, 'Times New Roman', serif"
    font-size="34"
    letter-spacing="0.5"
    fill="#faf8f4"
  >GT</text>
</svg>
